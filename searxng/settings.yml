# Settings fuer SearXNG als JSON-API hinter dem Masking-Proxy.
# WICHTIG: 'json' muss in den Formaten stehen, sonst liefert ?format=json 403.
#
# Robustheit gegen "No sources found": Frei scrapbare Engines blocken Server-IPs
# schnell mit CAPTCHA/429 (siehe Container-Logs: duckduckgo CAPTCHA,
# SearxEngineTooManyRequestsException). Gegenmassnahmen hier:
#  - kuratierte, tolerante Engine-Auswahl (Google/Startpage raus = CAPTCHA-Schleuder
#    fuer Server-IPs; Mojeek/Brave/Bing/Wikipedia sind deutlich vertraeglicher)
#  - hoehere Timeouts, damit langsame Engines nicht sofort rausfallen
#  - kuerzere Sperrzeiten, damit eine Engine nach einem Block schnell zurueckkommt
#    (Default: CAPTCHA sperrt eine Engine 1 Stunde!)
# Zusaetzlich in OWUI: WEB_SEARCH_CONCURRENT_REQUESTS niedrig -> weniger Burst.
use_default_settings:
  engines:
    keep_only:
      # Bewusst OHNE duckduckgo/google/startpage/qwant -> das sind die CAPTCHA-/
      # Block-Schleudern fuer Server-IPs (DDG CAPTCHA-t praktisch bei JEDER Anfrage).
      # Diese hier scrapen aus einer Server-IP am vertraeglichsten:
      - mojeek          # unabhaengiger Index, blockt fast nie -> Arbeitspferd
      - brave           # eigener Index, meist ok
      - bing            # breit, meist ok
      - wikipedia       # API: Fakten/Entitaeten (403 ist meist transient, heilt selbst)
      - wikidata        # API

server:
  # secret_key wird per ENV (SEARXNG_SECRET) gesetzt
  limiter: false                 # interner, vertrauenswuerdiger Aufruf -> Rate-Limiter aus
  image_proxy: true

search:
  formats:
    - html
    - json
  # Engine nach einem Block schneller wieder freigeben (Defaults sind viel hoeher):
  suspended_times:
    SearxEngineCaptcha: 600           # 10 min statt 3600 (1 h)
    SearxEngineTooManyRequests: 120   # 2 min statt 180
    SearxEngineAccessDenied: 120      # 2 min statt 180

outgoing:
  request_timeout: 8.0           # statt 3s Default -> langsame Engines (Mojeek/Brave) fallen nicht raus
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
  # --- Hebel (2): rotierende Egress-IP via Tor (GRATIS, keine offizielle API) --
  # AKTIV: SearXNG routet alle Engine-Requests ueber den 'tor'-Dienst -> jede
  # Anfrage kann ueber eine andere Tor-Exit-IP gehen, kein dauerhafter IP-Block.
  # SearXNG prueft beim Start via check.torproject.org, dass es WIRKLICH Tor ist
  # (braucht den 'tor'-Container; sonst startet searxng neu, bis Tor bereit ist).
  # Hinweis: langsamer; Google/DDG/Wikipedia koennen Tor-Exits blocken -> Mojeek/
  # Brave/Bing sind die Tor-Arbeitspferde. Abschalten: die 3 Zeilen unten
  # auskommentieren + 'docker compose -f docker-compose.yml restart searxng'.
  using_tor_proxy: true
  proxies:
    all://:
      - socks5h://tor:9050

# Keine externen Metriken/Telemetrie.
general:
  donation_url: false
  enable_metrics: false

ui:
  static_use_hash: true

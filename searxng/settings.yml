# ============================================================================
#  GLOBAL-CONFIG: Konfiguriert für sequentialisierte Proxy-Bursts
# ============================================================================

use_default_settings:
  engines:
    keep_only:
      - google # Findet global alles, wird durch Proxy-Delay geschützt
      - duckduckgo_lite # HTML-Lite Variante, extrem unempfindlich
      - qwant # Starker europäischer/globaler Index
      - mojeek # Unabhängiges Backup

server:
  limiter: false
  image_proxy: true

search:
  formats:
    - html
    - json
  default_lang: "" # <--- Leer lassen = Automatische Erkennung / Global

  suspended_times:
    SearxEngineCaptcha: 10
    SearxEngineTooManyRequests: 5
    SearxEngineAccessDenied: 5

engines:
  - name: google
    use_mobile_ui: true # Der Mobile-Trick bleibt aktiv (andere Bot-Filter)
    weight: 1.5

  - name: duckduckgo
    remove: true

  - name: duckduckgo_lite
    engine: duckduckgo_lite
    weight: 1.2

outgoing:
  request_timeout: 12.0 # Höherer Timeout, da Deep-Research-Seiten manchmal brauchen
  pool_connections: 200
  pool_maxsize: 50
  enable_http2: true

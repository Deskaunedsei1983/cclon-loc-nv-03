# ============================================================================
#  GLOBAL-CONFIG: Konfiguriert für sequentialisierte Proxy-Bursts
# ============================================================================

use_default_settings:
  engines:
    keep_only:
      # Saubere, ladbare Engine-Namen (KEIN Unterstrich, kein fehleranfaelliger
      # Custom-Block). Mit der presidio-Burst-Bremse sind brave/bing/ddg wieder ok;
      # mojeek/qwant sind die unabhaengigen Arbeitspferde. google raus = Parser bricht
      # an Googles Anti-Bot ("list index out of range").
      - mojeek
      - qwant
      - brave
      - bing
      - duckduckgo

server:
  limiter: false
  image_proxy: true

search:
  formats:
    - html
    - json
  default_lang: "" # <--- Leer lassen = Automatische Erkennung / Global

  suspended_times:
    SearxEngineCaptcha: 10
    SearxEngineTooManyRequests: 5
    SearxEngineAccessDenied: 5

outgoing:
  request_timeout: 12.0 # Höherer Timeout, da Deep-Research-Seiten manchmal brauchen
  pool_connections: 200
  pool_maxsize: 50
  enable_http2: true

# DSGVO: keine externen Metriken/Telemetrie.
general:
  donation_url: false
  enable_metrics: false

ui:
  static_use_hash: true


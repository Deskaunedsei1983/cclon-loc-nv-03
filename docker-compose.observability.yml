# ============================================================================
#  ZENTRALES LOGGING / OBSERVABILITY  (Overlay — separat vom Kernstack)
#  ---------------------------------------------------------------------------
#  Eine Sammelstelle fuer die Logs ALLER Container, damit nie wieder unklar ist,
#  "in welchem Container man schauen muss". Vier schlanke Dienste:
#
#    promtail  -> liest via Docker-Socket (ro) die Logs JEDES laufenden
#                 Containers (Kernstack + RAGFlow + vLLM + Upgrades) und schickt
#                 sie an Loki. Keine Per-Container-Konfig noetig.
#    loki      -> speichert alles durchsuchbar auf Platte (14 Tage), DSGVO-konform.
#    grafana   -> EINE Web-UI: Volltext-/Level-/Zeit-Suche ueber den ganzen Stack,
#                 inkl. fertigem Dashboard "AI-Stack — Container-Logs & Fehler"
#                 (Fehler/Warnungen-Uebersicht + dedizierter Websuche-Pfad-Panel).
#    dozzle    -> ultraleichter LIVE-Viewer aller Container-Logs (Triage in
#                 Echtzeit: "welcher Container schreit gerade?").
#
#  Start (Standard ueber start.sh, immer an):
#     docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#  Nur das Logging allein:
#     docker compose -f docker-compose.observability.yml up -d
#  Aus:  LOGGING_STACK=0 ./start.sh
#
#  Zugriffe:  Grafana http://localhost:${GRAFANA_PORT:-3011}
#             Dozzle  http://localhost:${DOZZLE_PORT:-8085}
# ============================================================================

services:
  # ---------- Log-Speicher ----------
  loki:
    image: grafana/loki:3.3.0
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    expose:
      - "3100"
    networks:
      - aistack-observability

  # ---------- Log-Sammler (Docker-Socket -> Loki) ----------
  promtail:
    image: grafana/promtail:3.3.0
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Read-only Docker-Socket -> Promtail entdeckt & liest die Logs aller Container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    depends_on:
      - loki
    networks:
      - aistack-observability

  # ---------- Web-UI: durchsuchbare, persistente Logs + Dashboard ----------
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3011}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      # Lokaler Single-User-Betrieb wie der Rest des Stacks (WEBUI_AUTH=false):
      # ohne Login direkt nutzbar (anonym = Admin), Login bleibt fuer Klarheit aktiv.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_BASIC_ENABLED=true
      # DSGVO/Air-Gap: keine Telemetrie, kein Update-Ping, kein News-Feed,
      # kein Plugin-Update-Check, kein Gravatar (kein externer Avatar-Abruf).
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_ANALYTICS_FEEDBACK_LINKS_ENABLED=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GF_USERS_DISABLE_GRAVATAR=true
      - GF_USERS_DEFAULT_THEME=dark
      - GF_LOG_LEVEL=warn
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - aistack-observability

  # ---------- Live-Viewer (Echtzeit-Triage, kein Speicher) ----------
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "${DOZZLE_PORT:-8085}:8080"
    environment:
      - DOZZLE_NO_ANALYTICS=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aistack-observability

  # ===========================================================================
  #  METRIKEN: Prometheus (TSDB) + Exporter -> in dasselbe Grafana eingeklinkt
  #  (Loki = Logs, Prometheus = Metriken). Liefert die Graphen, die Dozzle NICHT
  #  kann: GPU/VRAM, Disk-I/O, Netz in/out, alles pro Host UND pro Container.
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - aistack-observability

  # Host-Metriken: CPU/RAM/Disk-I/O/Netz pro Interface
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    networks:
      - aistack-observability

  # Pro-Container-Metriken: CPU/RAM/Netz/Disk (auch "interner" Container-Verkehr)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - aistack-observability

  # GPU-Metriken: Auslastung, VRAM, Temperatur, Power (via nvidia-smi -> robust
  # auch fuer brandneue GPUs/Blackwell, anders als DCGM). Nur lesend, kein VRAM-Bedarf.
  nvidia-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.2.1
    container_name: nvidia-exporter
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    expose:
      - "9835"
    networks:
      - aistack-observability

  # All-in-one Live-Metriken mit EIGENER UI (Auto-Erkennung GPU/Disk/Netz, pro
  # Sekunde). Null-Config; ideal zum sofortigen "was zieht gerade?"-Draufschauen.
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    restart: unless-stopped
    pid: host
    hostname: aistack-host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
      - DO_NOT_TRACK=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    ports:
      - "${NETDATA_PORT:-19999}:19999"
    volumes:
      - netdata-config:/etc/netdata
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aistack-observability

volumes:
  loki-data:
  grafana-data:
  promtail-positions:
  prometheus-data:
  netdata-config:
  netdata-lib:
  netdata-cache:

networks:
  # Eigenes, isoliertes Netz nur fuer die Logging-/Metrik-Dienste.
  # Promtail/Dozzle/cAdvisor/Netdata brauchen v.a. den Docker-Socket bzw. Host-Mounts.
  aistack-observability:
    name: aistack-observability
    driver: bridge

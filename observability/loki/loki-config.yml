# ============================================================================
#  Loki — zentraler Log-Speicher (single-process, Dateisystem, DSGVO-konform)
#  ---------------------------------------------------------------------------
#  Nimmt die Logs ALLER Container (von Promtail) entgegen, haelt sie 14 Tage
#  vor und macht sie in Grafana durchsuchbar (Volltext + Labels + Zeit).
#  Kein Auth (nur intern, aistack-observability), keine Telemetrie.
# ============================================================================
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 14 Tage Vorhaltung — reicht zum Debuggen, haelt die Platte schlank.
  retention_period: 336h
  allow_structured_metadata: true
  volume_enabled: true
  # vLLM kann sehr gespraechig sein -> Raten grosszuegig, damit nichts verworfen wird.
  ingestion_rate_mb: 24
  ingestion_burst_size_mb: 48
  per_stream_rate_limit: 24MB
  per_stream_rate_limit_burst: 48MB
  reject_old_samples: false

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Keine Nutzungs-Telemetrie nach aussen (passt zur DSGVO-Linie des Stacks).
analytics:
  reporting_enabled: false
